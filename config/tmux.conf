# Minimal tmux config for the Claude Code dev container.
# Goal: provide split-pane multitasking without the usual tmux annoyances.

# Hide the green status bar — Claude Code's TUI already uses the bottom row.
set -g status off

# Enable mouse: wheel-scroll, click-to-focus, drag-to-resize panes.
# Wheel-up enters tmux copy-mode and shows the pane's scrollback so you can
# read prior chat history.
set -g mouse on

# Generous scrollback so a long Claude session is fully reviewable.
set -g history-limit 50000

# Faster command sequences — the default 500ms makes Esc feel sluggish in
# Claude Code, Helix, and any other TUI.
set -sg escape-time 10

# 256-color + truecolor passthrough so Claude Code's syntax highlighting and
# the COLORTERM=truecolor env var actually do something.
set -g default-terminal "tmux-256color"
# Full value restated with `-g` (replace) rather than `-ga` (append): `-ga`
# is not idempotent across repeated `source-file` of this config (e.g. a
# manual `tmux source-file` while iterating on this file) — each re-source
# appends another duplicate ",*256col*:Tc" entry. `-g` overwrites the whole
# array every time instead, so N re-sources always converge on the same two
# entries. tmux 3.5a's compiled-in default (verified via `tmux -f /dev/null`)
# is exactly "linux*:AX@" — kept here so replacing (not appending) doesn't
# drop it. If the tmux version pin ever changes, re-derive this literal from
# a fresh `tmux -f /dev/null show -g terminal-overrides` before editing.
set -g terminal-overrides "linux*:AX@,*256col*:Tc"

# Restore the right-click pane menu (split/kill/zoom). tmux's stock root
# binding for MouseDown3Pane is conditional: it forwards the click to the
# pane (send-keys -M) whenever mouse_any_flag is set, and only opens
# display-menu otherwise. Claude Code's fullscreen renderer enables SGR mouse
# tracking, so mouse_any_flag is always 1 in a Claude Code pane and the stock
# binding's if-shell always takes the forward branch — display-menu never
# runs. Override it unconditionally so right-click always opens the menu.
bind-key -n MouseDown3Pane select-pane -t= \; display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -x M -y M \
  "Horizontal Split" h { split-window -h } \
  "Vertical Split" v { split-window -v } \
  "" \
  Kill X { kill-pane } \
  "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }

# User overrides — drop personal tweaks in ~/.tmux.conf.local; they survive
# template config-version syncs.
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
