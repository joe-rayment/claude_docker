# ── Claude Docker tmux config ──────────────────────────────────────────
# Prefix: CapsLk+b (remap Caps Lock → Ctrl on host, then CapsLk+b = Ctrl-b).
#
# Keybinding quick-reference (displayed on first attach):
#
#   CapsLk+b a       Toggle agent panels (hide/show)
#   CapsLk+b A       List agent panes
#   CapsLk+b Tab     Next pane
#   CapsLk+b S-Tab   Previous pane
#   CapsLk+b z       Zoom/unzoom pane (full-screen)
#   CapsLk+b h/j/k/l Vim-style pane navigation
#   CapsLk+b t       Re-tile layout
#   CapsLk+b |       Split left/right (vertical divider)
#   CapsLk+b -       Split top/bottom (horizontal divider)
#   Mouse            Click to select, drag to resize, scroll to browse

# ── General ────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Disable alternate screen buffer so TUI app output (Claude Code, vim, etc.)
# stays in the normal scrollback. Without this, scrolling up in Claude Code
# shows the shell underneath instead of conversation history.
set -ga terminal-overrides ",*:smcup@:rmcup@"
# Prefix: Ctrl-b (CapsLk+b when Caps Lock is remapped to Ctrl on host)
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
# Size windows based on the most recently active client, not the smallest.
# Without this, a second terminal attaching to the same session clamps both
# to the smallest dimensions (filling the larger one with dots).
set -g window-size latest
setw -g aggressive-resize on
set -g escape-time 0
set -g display-time 2000
set -g display-panes-time 3000

# ── Status bar ─────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour248"
set -g status-left-length 30
set -g status-left "#[fg=colour81,bold] #S #[fg=colour248,nobold]| "
set -g status-right-length 60
# Note: AGENTS_HIDDEN env var is set/unset by agent-panels.sh
set -g status-right "#[fg=colour248]panes: #{window_panes} | #{?#{AGENTS_HIDDEN},#[fg=colour214]agents hidden,#[fg=colour248]--} "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour81,bold] #I:#W "

# ── Hint line ────────────────────────────────────────────────────────
set -g status 2
set -g status-format[1] "#[align=centre,fg=colour243] CapsLk+b  w list windows  |  c new window  |  |/- split  |  & close window  |  x close pane "

# ── Pane styling ───────────────────────────────────────────────────────
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour81"
set -g pane-border-lines heavy

# ── Signal / shutdown hooks ───────────────────────────────────────────
# When the last client disconnects (docker stop → SIGTERM → client killed,
# or user closes all terminals), shut down the tmux server so all child
# processes (shells, agents) exit cleanly instead of waiting for SIGKILL.
# #{session_attached} is the count of clients on the session; 0 means no
# clients remain after this detach event.
set-hook -g client-detached 'if -F "#{==:#{session_attached},0}" "run-shell \"tmux kill-server\""'

# ── Auto-layout hooks ─────────────────────────────────────────────────
# Conditional on session name "main" so test sessions (claude-dev-test)
# and other tools that create their own tmux sessions are not affected.
# Uses tmux if-shell with format comparison (fast, no shell fork).
set-hook -g after-split-window "if -F '#{==:#{session_name},main}' 'select-layout tiled'"
set-hook -g pane-exited "if -F '#{==:#{session_name},main}' 'select-layout tiled'"

# ── Agent panel management ─────────────────────────────────────────────
# Toggle agent panels: CapsLk+b a
bind a run-shell "agent-panels toggle"
# List agent panes: CapsLk+b A
bind A run-shell "agent-panels list"

# ── Pane navigation ───────────────────────────────────────────────────
# Cycle panes: CapsLk+b Tab / CapsLk+b Shift-Tab
bind Tab select-pane -t :.+
bind BTab select-pane -t :.-

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Manual re-tile
bind t select-layout tiled

# Split keeping current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"
