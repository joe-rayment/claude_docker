# ── Claude Docker tmux config ──────────────────────────────────────────
# Prefix: Ctrl-b (tmux default). Kept to avoid conflict with Ctrl-a
# (zsh beginning-of-line), which is heavily used in shell editing.
#
# Keybinding quick-reference (displayed on first attach):
#
#   Ctrl-b a       Toggle agent panels (hide/show)
#   Ctrl-b A       List agent panes
#   Ctrl-b Tab     Next pane
#   Ctrl-b S-Tab   Previous pane
#   Ctrl-b z       Zoom/unzoom pane (full-screen)
#   Ctrl-b h/j/k/l Vim-style pane navigation
#   Ctrl-b t       Re-tile layout
#   Ctrl-b |       Split horizontal
#   Ctrl-b -       Split vertical
#   Mouse          Click to select, drag to resize, scroll to browse

# ── General ────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g display-time 2000
set -g display-panes-time 3000

# ── Status bar ─────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour248"
set -g status-left-length 30
set -g status-left "#[fg=colour81,bold] #S #[fg=colour248,nobold]| "
set -g status-right-length 60
set -g status-right "#[fg=colour248]panes: #{window_panes} | #(if tmux list-windows -F '#{window_name}' 2>/dev/null | grep -qx _agents; then echo '#[fg=colour214]agents hidden'; else echo '#[fg=colour248]--'; fi) "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour81,bold] #I:#W "

# ── Pane styling ───────────────────────────────────────────────────────
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour81"
set -g pane-border-lines heavy

# ── Auto-layout hooks ─────────────────────────────────────────────────
# Conditional on session name "main" so test sessions (claude-dev-test)
# and other tools that create their own tmux sessions are not affected.
# Uses tmux if-shell with format comparison (fast, no shell fork).
set-hook -g after-split-window "if -F '#{==:#{session_name},main}' 'select-layout tiled'"
set-hook -g pane-exited "if -F '#{==:#{session_name},main}' 'select-layout tiled'"

# ── Agent panel management ─────────────────────────────────────────────
# Toggle agent panels: Ctrl-b a
bind a run-shell "agent-panels toggle"
# List agent panes: Ctrl-b A
bind A run-shell "agent-panels list"

# ── Pane navigation ───────────────────────────────────────────────────
# Cycle panes: Ctrl-b Tab / Ctrl-b Shift-Tab
bind Tab select-pane -t :.+
bind BTab select-pane -t :.-

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Manual re-tile
bind t select-layout tiled

# Split keeping current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"
