# Minimal tmux config for the Claude Code dev container.
# Goal: provide split-pane multitasking without the usual tmux annoyances.

# Status off (beads_claude_docker-3c20): parked ("hidden") windows --
# fleet-menu hide moves a pane into a backgrounded window rather than
# destroying it -- are reachable from the sidebar (`fleet`, prefix S /
# menu "Sidebar"), which now lists every worktree and every other
# window, and from Restore…/Jump…, so no status row is needed and
# Claude Code's TUI keeps every line of the pane.
set -g status off

# Enable mouse: wheel-scroll, click-to-focus, drag-to-resize panes.
# Wheel-up enters tmux copy-mode and shows the pane's scrollback so you can
# read prior chat history.
set -g mouse on

# Generous scrollback so a long Claude session is fully reviewable.
set -g history-limit 50000

# Faster command sequences — the default 500ms makes Esc feel sluggish in
# Claude Code, Helix, and any other TUI.
set -sg escape-time 10

# 256-color + truecolor passthrough so Claude Code's syntax highlighting and
# the COLORTERM=truecolor env var actually do something.
set -g default-terminal "tmux-256color"
# Full value restated with `-g` (replace) rather than `-ga` (append): `-ga`
# is not idempotent across repeated `source-file` of this config (e.g. a
# manual `tmux source-file` while iterating on this file) — each re-source
# appends another duplicate ",*256col*:Tc" entry. `-g` overwrites the whole
# array every time instead, so N re-sources always converge on the same two
# entries. tmux 3.5a's compiled-in default (verified via `tmux -f /dev/null`)
# is exactly "linux*:AX@" — kept here so replacing (not appending) doesn't
# drop it. If the tmux version pin ever changes, re-derive this literal from
# a fresh `tmux -f /dev/null show -g terminal-overrides` before editing.
set -g terminal-overrides "linux*:AX@,*256col*:Tc"

# Restore the right-click pane menu (split/kill/zoom). tmux's stock root
# binding for MouseDown3Pane is conditional: it forwards the click to the
# pane (send-keys -M) whenever mouse_any_flag is set, and only opens
# display-menu otherwise. Claude Code's fullscreen renderer enables SGR mouse
# tracking, so mouse_any_flag is always 1 in a Claude Code pane and the stock
# binding's if-shell always takes the forward branch — display-menu never
# runs. Override it unconditionally so right-click always opens the menu.
bind-key -n MouseDown3Pane select-pane -t= \; display-menu -T "#[align=centre]#{pane_index} (#{pane_id}) · prefix N/H/R/J/V/M/S" -x M -y M \
  "New worktree session" N { run-shell "fleet-menu new #{pane_id} #{pane_current_path}" } \
  "Hide" H { run-shell "fleet-menu hide #{pane_id}" } \
  "Restore…" R { run-shell "fleet-menu restore #{pane_id}" } \
  "Jump…" J { run-shell "fleet-menu jump #{pane_id}" } \
  "Review…" V { run-shell "fleet-menu review #{pane_id} #{pane_current_path}" } \
  "Remove merged…" M { run-shell "fleet-menu remove-merged #{pane_id} #{pane_current_path}" } \
  "Sidebar" S { run-shell "fleet-menu sidebar #{pane_id}" } \
  "" \
  "Horizontal Split" h { split-window -h } \
  "Vertical Split" v { split-window -v } \
  "" \
  Kill X { kill-pane } \
  "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }

# Fleet menu — same seven actions as the MouseDown3Pane extension above,
# reachable without the mouse via prefix + N/H/R/J/V/M/S. See scripts/fleet-menu.sh.
# #{pane_id} (and #{pane_current_path}, where fleet-menu needs a repo
# root) is passed explicitly and expanded by tmux at fire-time: run-shell
# spawns fleet-menu with no TMUX_PANE, so a bare ambient `tmux display -p`
# inside the script would fall back to its own best guess at "current"
# rather than the exact pane that fired the binding.
bind-key N run-shell "fleet-menu new #{pane_id} #{pane_current_path}"
bind-key H run-shell "fleet-menu hide #{pane_id}"
bind-key R run-shell "fleet-menu restore #{pane_id}"
bind-key J run-shell "fleet-menu jump #{pane_id}"
bind-key V run-shell "fleet-menu review #{pane_id} #{pane_current_path}"
bind-key M run-shell "fleet-menu remove-merged #{pane_id} #{pane_current_path}"
# Sidebar (beads_claude_docker-1tym / -blrl): toggles the live
# worktree/session/agent table in a 34-column left pane. fleet-menu's own
# `sidebar` subcommand just delegates to `fleet toggle`, so the sidebar
# stays reachable from the same menu/keybinding surface as every other
# fleet action rather than needing its own separate binding convention.
bind-key S run-shell "fleet-menu sidebar #{pane_id}"

# User overrides — drop personal tweaks in ~/.tmux.conf.local; they survive
# template config-version syncs.
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
