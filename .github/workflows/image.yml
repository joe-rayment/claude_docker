name: image

# Builds the claude_orca v3 image and publishes it. This box cannot run
# containers, so this workflow is also the only place "the image builds,
# Orca serves in it, and ./claude-dev starts it" can be checked for real
# (.claude/plans/container-v3.md S7) -- but those checks are OPT-IN: run
# the workflow by hand with `run_tests: true` to get them.
#
# WHY OPT-IN. The smoke/e2e steps used to sit in front of the push, so any
# one of them going red meant the image never republished and a fix that
# was already committed could not reach the machine that needed it.
# Publishing is never held hostage to a test: on a push to main this
# workflow builds and pushes, and nothing else. The tests are preserved
# below, guarded by RUN_TESTS, and are re-enabled from the Actions tab
# whenever the image itself is what is in question.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Also run the smoke/e2e tests (the publish happens either way)"
        type: boolean
        default: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/joe-rayment/claude_orca
  # The single condition every test step below is guarded by. On a `push`
  # the left half is false, so GitHub short-circuits to false and no test
  # runs; on a `workflow_dispatch` it is whatever the run_tests box said.
  RUN_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Native amd64 first, loaded into the local daemon so the smoke stage
      # can actually run it. It holds the whole install -- the apt half
      # (IMAGE_PHASES) and the toolchain, one layer per phase -- so what
      # the smoke below proves is that a folder pulling this image is
      # ready the moment its container starts.
      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Opt-in from here down. Orca must serve, and the web URL must
      # answer, inside the image that was just built. smoke.sh makes its
      # own temp git project. This no longer gates the publish -- it is
      # the check you ask for when the image itself is in question.
      - name: Smoke test (Orca serves headless in the image)
        if: env.RUN_TESTS == 'true'
        run: |
          docker run --rm -e CLAUDE_ORCA_SMOKE=1 ${{ env.IMAGE }}:smoke \
            /opt/claude-orca/scripts/container/smoke.sh

      # The other half of startup v4 (claude-orca-qa2.10): a folder whose gh
      # token cannot pull the prebuilt image runs plain ubuntu:24.04 with
      # the mounted template's entrypoint, and setup.sh installs the
      # toolchain inside the VM on that first start. Nothing on a dev box
      # can run that, so this is where it is proven -- same smoke.sh, no
      # /opt/claude-orca, the checkout mounted the way `container run`
      # mounts the project.
      - name: Smoke test (runtime install on plain ubuntu:24.04)
        if: env.RUN_TESTS == 'true'
        run: |
          docker run --rm -v "$PWD:/opt/claude-orca-mount" -e CLAUDE_ORCA_SMOKE=1 \
            docker.io/library/ubuntu:24.04 \
            bash /opt/claude-orca-mount/scripts/container/smoke.sh

      # e2e: the host side, which nothing could exercise while the runtime
      # was Apple's `container` -- it runs on no CI machine and on no dev
      # box here. With Docker as the runtime it is just bash and a daemon:
      # ubuntu-latest has both, so the folder is laid out the way
      # bootstrap.sh leaves it and the REAL scripts/launcher.sh is driven
      # through a normal start. Nothing is fetched: CLAUDE_ORCA_IMAGE names
      # the tag the build step above already loaded into this daemon, and
      # CLAUDE_ORCA_OPEN=0 stops the launcher reaching for a browser.
      - name: e2e (the real launcher starts a real container)
        if: env.RUN_TESTS == 'true'
        env:
          CLAUDE_ORCA_OPEN: "0"
          CLAUDE_ORCA_IMAGE: ${{ env.IMAGE }}:smoke
          CLAUDE_ORCA_WEBURL_TIMEOUT: "300"
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/e2e-project"

          rm -rf "$project"
          mkdir -p "$project"
          git init -q -b main "$project"
          git -C "$project" -c user.email=e2e@example.com -c user.name=e2e \
              commit -q --allow-empty -m e2e

          # What bootstrap.sh leaves in a folder: the template clone and
          # the bin/ symlinks into it. Bootstrap clones from GitHub; here
          # the checkout under test IS the template, copied rather than
          # cloned so the working tree is what gets exercised.
          mkdir -p "$project/.claude-dev/template"
          cp -a "$GITHUB_WORKSPACE/." "$project/.claude-dev/template/"
          "$project/.claude-dev/template/scripts/link-bin.sh" "$project/.claude-dev"

          # ... and the two files `register` would write before it opens the
          # folder. They are seeded here rather than by running `register`
          # because acquire_image decides pulled-vs-runtime by attempting a
          # GHCR pull, and this job must contact no registry: the image it
          # exercises is the one built above, already in this daemon.
          # Everything after this point is the launcher's own work.
          mkdir -p "$project/.claude-dev/run"
          printf '%s\n' '{"version":3,"port":null,"cpus":null,"memory":null,"extraMounts":[]}' \
              > "$project/.claude-dev/claude-orca.json"
          printf 'pulled\n' > "$project/.claude-dev/run/image-source"

          # The everyday command: choose the port, create the container,
          # wait for the handshake file the entrypoint writes.
          "$project/.claude-dev/bin/claude-dev"

      - name: e2e (the container is up and Orca answers on the published port)
        if: env.RUN_TESTS == 'true'
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/e2e-project"
          # container_name() in scripts/launcher.sh: claude-orca-<folder>.
          name="claude-orca-e2e-project"
          url_file="$project/.claude-dev/run/orca-web-url.txt"

          fail() { echo "e2e FAIL: $*" >&2; exit 1; }

          state="$(docker inspect -f '{{.State.Status}}' "$name")" \
              || fail "no container named $name"
          [ "$state" = "running" ] || fail "$name is '$state', expected running"
          echo "ok -- container $name is running"

          # A fallback image here would mean the launcher ignored
          # CLAUDE_ORCA_IMAGE and went looking for a registry.
          ran="$(docker inspect -f '{{.Config.Image}}' "$name")"
          [ "$ran" = "$IMAGE:smoke" ] \
              || fail "$name runs '$ran', expected $IMAGE:smoke"
          echo "ok -- it runs the locally built $ran"

          ports="$(docker inspect -f '{{json .NetworkSettings.Ports}}' "$name")"
          case "$ports" in
              *127.0.0.1*) echo "ok -- published on 127.0.0.1 only: $ports" ;;
              *) fail "the port is not bound to 127.0.0.1: $ports" ;;
          esac

          [ -s "$url_file" ] || fail "no $url_file (Orca published no web url)"
          mode="$(stat -c '%a' "$url_file")"
          [ "$mode" = "600" ] || fail "$url_file is mode $mode, expected 600"
          url="$(head -1 "$url_file")"
          [ -n "$url" ] || fail "$url_file is empty"
          echo "ok -- web url published, mode $mode"

          # The fragment carries the pairing code, so it is dropped before
          # the request rather than sent to the server.
          base="${url%%#*}"
          body="$RUNNER_TEMP/e2e-body.html"
          code="$(curl -sSL -o "$body" -w '%{http_code}' --max-time 30 "$base")"
          case "$code" in
              2??|3??) echo "ok -- GET $base -> $code" ;;
              *) fail "GET $base -> $code" ;;
          esac
          grep -qi 'orca' "$body" \
              || fail "the served page does not look like Orca: $(head -c 200 "$body")"
          echo "ok -- the page it served is Orca Web"
          echo "e2e: all checks passed"

      # The claim the image now makes, checked with a daemon: it arrives
      # complete. A folder that pulls it installs nothing, grows no
      # toolchain directory, and serves in seconds -- and can still be
      # thrown away by the person who owns it.
      - name: e2e (the image arrives complete, and the folder stays disposable)
        if: env.RUN_TESTS == 'true'
        env:
          CLAUDE_ORCA_OPEN: "0"
          CLAUDE_ORCA_IMAGE: ${{ env.IMAGE }}:smoke
          CLAUDE_ORCA_WEBURL_TIMEOUT: "300"
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/e2e-project"
          name="claude-orca-e2e-project"
          fail() { echo "e2e FAIL: $*" >&2; exit 1; }

          # 1. The shape. setup.sh --check is the whole toolchain
          #    answering for itself: every tool, its version, its path.
          #
          #    Its EXIT STATUS is not the gate, and cannot be: the
          #    entrypoint remaps `agent` to the host uid (1001 here, 501 on
          #    a Mac), so the uid row always reports FAIL in a running
          #    container. That one row is allowed; nothing else is.
          check() { docker exec "$name" \
              /opt/claude-orca/scripts/container/setup.sh --check 2>&1 || true; }

          check > "$RUNNER_TEMP/shape.txt"
          notok="$(grep -v '^\[check\] ok' "$RUNNER_TEMP/shape.txt" || true)"
          [ "$(printf '%s' "$notok" | grep -c .)" = "1" ] \
              || fail "expected exactly one non-ok row (the remapped uid), got:
          $notok"
          printf '%s' "$notok" | grep -q 'agent user: want uid' \
              || fail "the one non-ok row is not the uid row: $notok"
          echo "ok -- the image is the filesystem it promised:"
          sed 's/^/     /' "$RUNNER_TEMP/shape.txt"

          # 2. Nothing was installed into the folder. A toolchain
          #    directory here would mean the image shipped incomplete and
          #    the folder paid for it -- the 15 minutes this design exists
          #    to stop paying.
          [ ! -d "$project/.claude-dev/toolchain" ] \
              || fail "the folder grew a toolchain directory: $(du -sh "$project/.claude-dev/toolchain" | cut -f1)"
          echo "ok -- the folder carries no toolchain; the image has it"

          # 3. The recreate, and the number a person feels every day.
          docker rm -f "$name" >/dev/null
          start="$(date +%s)"
          "$project/.claude-dev/bin/claude-dev" >/dev/null \
              || fail "the recreate did not come up"
          took=$(( $(date +%s) - start ))
          echo "ok -- recreated and serving again in ${took}s"
          [ "$took" -lt 90 ] || fail "a recreate took ${took}s; the image is not being reused"

          grep -q 'all phases done' "$project/.claude-dev/run/setup.log" \
              || fail "setup.sh did not finish on the recreate"
          grep -q 'installing' "$project/.claude-dev/run/setup.log" \
              && fail "the recreate installed something: $(grep 'installing' "$project/.claude-dev/run/setup.log" | head -3)"
          echo "ok -- every phase reported already-present"

          # 4. And the folder can still be thrown away by its owner.
          "$project/.claude-dev/bin/claude-dev" --teardown >/dev/null \
              || fail "--teardown failed"
          [ ! -e "$project/.claude-dev" ] \
              || fail "--teardown left $(du -sh "$project/.claude-dev" | cut -f1) behind"
          echo "ok -- teardown removed the folder as the ordinary user"

      - name: e2e diagnostics
        if: ${{ failure() && env.RUN_TESTS == 'true' }}
        run: |
          project="$RUNNER_TEMP/e2e-project"
          name="claude-orca-e2e-project"
          for f in container.log setup.log orca-serve.log; do
              echo "===== .claude-dev/run/$f ====="
              tail -200 "$project/.claude-dev/run/$f" 2>/dev/null || echo "(absent)"
          done
          echo "===== docker ps -a ====="
          docker ps -a || true
          echo "===== docker logs $name ====="
          docker logs --tail 300 "$name" 2>&1 || true

      - name: e2e teardown
        if: ${{ always() && env.RUN_TESTS == 'true' }}
        run: |
          docker rm -f claude-orca-e2e-project >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/e2e-project" "$RUNNER_TEMP/e2e-body.html"

      # The publish, and the point of the whole workflow: it runs on every
      # push, and `always()` keeps it running even when an opt-in test
      # step above went red. The job still reports that failure -- what it
      # no longer does is withhold the image because of it. A failure of
      # this step itself is a red job, as it must be.
      - name: Build and push multi-arch
        if: always()
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The whole product on the platform it is actually for: a real Mac, a
  # real Docker daemon, the real bootstrap.sh, the real launcher.sh, and a
  # real container serving Orca over a real published port. Everywhere else
  # bootstrap.sh is only ever run against tests/helpers/setup.bash's stubs
  # on Linux, so nothing checked that it survives real bash 3.2 (macOS
  # ships 3.2.57), real BSD userland (stat, readlink), `git clone` and
  # `ln -sfn` on APFS, or Docker-on-macOS at all.
  #
  # NO SHIM. GitHub's macOS runners cannot run Docker Desktop headless, so
  # the daemon comes from colima, which boots a real Linux VM and a real
  # dockerd on the runner. If colima cannot start, this job FAILS and says
  # the macOS path is unverified. It never substitutes a fake: a green that
  # proves nothing is worse than an honest red. The "daemon is real" step
  # below is the gate -- a trivial container must actually run before
  # anything else is attempted.
  #
  # OPT-IN, like every other test here: this job runs only on a
  # workflow_dispatch with run_tests: true. Nothing it does can hold up the
  # image push -- the publish in `build` is unconditional now, and this job
  # has no `needs: build` either, so it is never queued behind, nor hidden
  # by, an unrelated build failure.
  #
  # WHICH IMAGE, and the tradeoff: the image it exercises is the multi-arch
  # `:latest` from the PREVIOUS push, not one built alongside it -- which is
  # the right trade, because the image's own contents are what the linux
  # job's two smoke stages prove, while what only a Mac can prove is the
  # host side: the preflight, the clone, the argv, the mounts, the port
  # forward.
  # `:latest` is also exactly what a user's Mac pulls (IMAGE_TAG pins it),
  # so the launcher does its own real GHCR login and pull here.
  #
  # macos-latest is Apple silicon, so the arm64 half of the multi-arch
  # manifest is what gets run; the pull gate below fails loudly rather than
  # letting the launcher fall back to its several-minute in-VM toolchain
  # install, which would blow the timeout and prove nothing either way.
  macos-docker-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CNAME: claude-orca-mac-project
    steps:
      - uses: actions/checkout@v4

      # PROJECT cannot live in the job-level `env:` above: the `runner`
      # context is not available there (only github, inputs, matrix, needs,
      # secrets, strategy and vars are), and GitHub rejects the whole
      # workflow rather than the one line -- run 34068515697 died in 0s with
      # zero jobs. $RUNNER_TEMP is an ordinary variable inside a `run:`
      # block, so resolve it here and publish it to every later step.
      - name: Resolve the project path
        run: |
          echo "PROJECT=$RUNNER_TEMP/mac-project" >> "$GITHUB_ENV"

      - name: Preflight facts (recorded, not asserted)
        run: |
          sw_vers
          uname -sm
          /bin/bash --version | head -1
          git --version
          gh --version | head -1
          jq --version

      # qemu is installed even though vz is tried first: colima validates
      # `--vm-type qemu` against qemu-img BEFORE it boots anything, so
      # without this package the qemu branch below is not a fallback at
      # all -- it dies at config validation without ever starting a VM,
      # which is exactly how run 34120180831 ended.
      - name: Install colima, the docker CLI and qemu
        run: |
          set -euo pipefail
          brew update --quiet || true
          brew install colima docker qemu
          colima version
          docker --version
          qemu-img --version | head -1

      # First boot downloads and unpacks a VM image, so this is the slow
      # step. vz (Apple's Virtualization framework) with virtiofs is tried
      # first because it is much faster; qemu is the fallback for a runner
      # that cannot nest vz. $RUNNER_TEMP is mounted WRITABLE on purpose:
      # colima mounts the home directory read-only by default, and the
      # project folder is bind-mounted into the container and written to by
      # the entrypoint (run/orca-web-url.txt, /home/agent).
      #
      # 50 minutes, not 30: qemu on an Apple silicon runner is emulated
      # rather than accelerated, so a first boot that takes ~5 minutes
      # under vz can take most of an hour. The job timeout goes to 90 to
      # match, leaving ~40 for the pull, the bootstrap (whose own web-url
      # wait is 900s) and the assertions.
      - name: Start a real Linux VM and dockerd (colima)
        timeout-minutes: 50
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT"

          # colima's fatal message points at lima's hostagent logs and we
          # used to throw them away, so a vz failure had no diagnosis.
          # They must be dumped BEFORE the next `colima delete`, which
          # removes the instance directory that holds them.
          lima_logs() {
            local d="$HOME/.colima/_lima/colima" f
            echo "===== lima hostagent logs ($d) ====="
            for f in "$d/ha.stderr.log" "$d/ha.stdout.log"; do
              echo "----- $f -----"
              tail -100 "$f" 2>/dev/null || echo "(absent)"
            done
            for f in "$d"/serial*.log; do
              [ -f "$f" ] || continue
              echo "----- $f -----"
              tail -100 "$f" 2>/dev/null || true
            done
          }

          attempt() {
            echo "==> colima start --vm-type=$1 --mount-type=$2"
            colima delete --force >/dev/null 2>&1 || true
            if colima start --cpu 3 --memory 6 --disk 30 \
                --vm-type "$1" --mount-type "$2" \
                --mount "$RUNNER_TEMP:w"; then
              return 0
            fi
            echo "colima start --vm-type=$1 failed; its own logs follow" >&2
            lima_logs
            return 1
          }

          if attempt vz virtiofs; then
            echo "colima: up on the Apple Virtualization framework"
          elif attempt qemu sshfs; then
            echo "colima: up on qemu"
          else
            echo "macos FAIL: colima could not start a Linux VM on this runner." >&2
            echo "  The macOS Docker path is UNVERIFIED by this run." >&2
            echo "  No shim is substituted: a fake daemon would make this job lie." >&2
            colima status || true
            exit 1
          fi
          colima status
          colima list

      # The gate. Nothing past here is allowed to run against a pretend
      # daemon, so the daemon has to prove itself by running a container.
      - name: Prove the daemon is real (and that no shim is on PATH)
        run: |
          set -euo pipefail
          fail() { echo "macos FAIL: $*" >&2; exit 1; }

          resolved="$(command -v docker)" || fail "no docker on PATH"
          case "$resolved" in
            "$RUNNER_TEMP"/*|*shim*|*stub*) fail "docker resolves to $resolved" ;;
          esac
          echo "ok -- docker is $resolved"

          docker info || fail "'docker info' failed: there is no daemon"
          server="$(docker version --format '{{.Server.Version}}')" \
            || fail "no Server section: the CLI is talking to nothing"
          arch="$(docker version --format '{{.Server.Arch}}')"
          os="$(docker version --format '{{.Server.Os}}')"
          echo "ok -- daemon $server, $os/$arch"
          [ "$os" = "linux" ] || fail "the daemon reports $os, expected linux"

          # A real container, really run. This is what a shim cannot do,
          # and what a daemon that answers `info` but cannot unshare
          # namespaces also cannot do -- so the message keeps docker's own
          # words rather than just the exit status.
          # Pulled first and separately so the two failures stay apart:
          # a VM with no network, and a VM that cannot start a container.
          # Both keep docker's own words -- the reason IS the diagnosis.
          pulled="$(docker pull --quiet alpine 2>&1)" \
            || fail "'docker pull alpine' failed: $pulled"
          out="$(docker run --rm alpine echo daemon-is-real 2>&1)" \
            || fail "'docker run alpine' failed: $out"
          [ "$out" = "daemon-is-real" ] \
            || fail "'docker run alpine' printed '$out'"
          echo "ok -- a container ran and printed: $out"

      # Fail in a minute with a clear reason if the arm64 image is not
      # published, rather than in forty with a timeout. The launcher does
      # its own login and pull straight after; this only warms the cache.
      - name: Gate -- the published multi-arch image must be pullable here
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:latest" || {
            echo "macos FAIL: cannot pull $IMAGE:latest for $(uname -m)." >&2
            echo "  The Mac path is unverified this run: without the prebuilt" >&2
            echo "  image the launcher falls back to its in-VM toolchain install." >&2
            exit 1
          }
          docker image inspect "$IMAGE:latest" \
            --format 'pulled {{.Id}} {{.Os}}/{{.Architecture}}'

      # The real one-liner's work, minus only the network clone: the
      # template comes from this checkout instead of github.com, so the
      # commit under test is the one that gets installed. Nothing else is
      # substituted -- bootstrap runs its own preflight, its own
      # `docker info`, its own `register`, its own `docker run`.
      - name: Run the real bootstrap.sh against a throwaway project
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_ORCA_OPEN: "0"
          CLAUDE_ORCA_WEBURL_TIMEOUT: "900"
        run: |
          set -euo pipefail
          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"
          git init -q -b main "$PROJECT"
          git -C "$PROJECT" -c user.email=mac@example.com -c user.name=mac \
              commit -q --allow-empty -m mac

          CLAUDE_ORCA_TEMPLATE_URL="$GITHUB_WORKSPACE" \
              bash "$GITHUB_WORKSPACE/bootstrap.sh" "$PROJECT"

      - name: Assert the layout bootstrap.sh left behind
        run: |
          set -euo pipefail
          host="$PROJECT/.claude-dev"
          fail() { echo "macos FAIL: $*" >&2; exit 1; }

          for d in template bin home; do
              [ -d "$host/$d" ] || fail "no $host/$d"
          done
          [ -d "$host/template/.git" ] || fail "the template clone has no .git"
          echo "ok -- .claude-dev/{template,bin,home} exist"

          # A RELATIVE symlink into the clone beside it: the folder has to
          # stay movable, and `claude-dev --update` must not need relinking.
          [ -L "$host/bin/claude-dev" ] || fail "bin/claude-dev is not a symlink"
          target="$(readlink "$host/bin/claude-dev")"
          [ "$target" = "../template/scripts/launcher.sh" ] \
              || fail "bin/claude-dev -> '$target', expected ../template/scripts/launcher.sh"
          [ -x "$host/bin/claude-dev" ] || fail "bin/claude-dev is not executable"
          echo "ok -- bin/claude-dev -> $target, executable"

          json="$host/claude-orca.json"
          [ -f "$json" ] || fail "no claude-orca.json"
          jq -e '.version == 3' "$json" >/dev/null || fail "claude-orca.json is not version 3"
          jq -e '.cpus == null and .memory == null and .extraMounts == []' "$json" >/dev/null \
              || fail "claude-orca.json defaults are wrong: $(cat "$json")"
          port="$(jq -r '.port' "$json")"
          case "$port" in
              ''|*[!0-9]*) fail "claude-orca.json port is '$port'" ;;
          esac
          [ "$port" -ge 6768 ] || fail "port $port is below the 6768 base"
          [ "$(cat "$host/run/port")" = "$port" ] \
              || fail "run/port disagrees with claude-orca.json"
          echo "ok -- claude-orca.json v3, defaults null/[], port $port"

          # The Mac side must leave nothing outside the folder.
          [ ! -e "$HOME/.claude-dev" ] || fail "$HOME/.claude-dev was created"
          echo "ok -- nothing installed outside the project folder"

      # The same evidence the linux e2e stage demands, asserted on macOS:
      # the container is up, it is the prebuilt image, the port is bound to
      # loopback only, the handshake file is mode 600, and the URL serves
      # Orca. The curl is retried because colima forwards the guest's
      # published port to the host a moment after the bind.
      - name: Assert the container is up and Orca answers on the published port
        run: |
          set -euo pipefail
          fail() { echo "macos FAIL: $*" >&2; exit 1; }
          url_file="$PROJECT/.claude-dev/run/orca-web-url.txt"

          state="$(docker inspect -f '{{.State.Status}}' "$CNAME")" \
              || fail "no container named $CNAME"
          [ "$state" = "running" ] || fail "$CNAME is '$state', expected running"
          echo "ok -- container $CNAME is running"

          ran="$(docker inspect -f '{{.Config.Image}}' "$CNAME")"
          [ "$ran" = "$IMAGE:latest" ] \
              || fail "$CNAME runs '$ran', expected $IMAGE:latest (the runtime fallback was taken)"
          echo "ok -- it runs the published $ran"

          ports="$(docker inspect -f '{{json .NetworkSettings.Ports}}' "$CNAME")"
          case "$ports" in
              *127.0.0.1*) echo "ok -- published on 127.0.0.1 only: $ports" ;;
              *) fail "the port is not bound to 127.0.0.1: $ports" ;;
          esac

          [ -s "$url_file" ] || fail "no $url_file (Orca published no web url)"
          mode="$(stat -f '%Lp' "$url_file")"
          [ "$mode" = "600" ] || fail "$url_file is mode $mode, expected 600"
          url="$(head -1 "$url_file")"
          [ -n "$url" ] || fail "$url_file is empty"
          echo "ok -- web url published, mode $mode"

          # The fragment carries the pairing code, so it is dropped before
          # the request rather than sent to the server.
          base="${url%%#*}"
          body="$RUNNER_TEMP/mac-body.html"
          code=""
          waited=0
          while [ "$waited" -lt 120 ]; do
              code="$(curl -sSL -o "$body" -w '%{http_code}' --max-time 20 "$base" || true)"
              case "$code" in 2??|3??) break ;; esac
              sleep 5
              waited=$((waited + 5))
          done
          case "$code" in
              2??|3??) echo "ok -- GET $base -> $code after ${waited}s" ;;
              *) fail "GET $base -> '$code' after ${waited}s" ;;
          esac
          grep -qi 'orca' "$body" \
              || fail "the served page does not look like Orca: $(head -c 200 "$body")"
          echo "ok -- the page it served is Orca Web"
          echo "macos-docker-e2e: all checks passed"

      - name: macOS diagnostics
        if: failure()
        run: |
          echo "===== colima ====="
          colima status || true
          colima list || true
          echo "===== lima hostagent logs ====="
          limadir="$HOME/.colima/_lima/colima"
          for f in "$limadir/ha.stderr.log" "$limadir/ha.stdout.log"; do
              echo "----- $f -----"
              tail -100 "$f" 2>/dev/null || echo "(absent)"
          done
          for f in "$limadir"/serial*.log; do
              [ -f "$f" ] || continue
              echo "----- $f -----"
              tail -100 "$f" 2>/dev/null || true
          done
          echo "===== docker ====="
          docker version || true
          docker ps -a || true
          echo "===== .claude-dev/run ====="
          for f in container.log setup.log orca-serve.log; do
              echo "----- $f -----"
              tail -200 "$PROJECT/.claude-dev/run/$f" 2>/dev/null || echo "(absent)"
          done
          echo "===== docker logs $CNAME ====="
          docker logs --tail 300 "$CNAME" 2>&1 || true

      - name: macOS teardown
        if: always()
        run: |
          docker rm -f "$CNAME" >/dev/null 2>&1 || true
          colima delete --force >/dev/null 2>&1 || true
          rm -rf "$PROJECT" "$RUNNER_TEMP/mac-body.html"
